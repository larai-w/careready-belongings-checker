<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>smoke</title></head>
<body><pre id="log"></pre>
<script type="module">
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
window.addEventListener('error', (e) => log('WINDOW_ERR: ' + e.message));
try {
    // storage
    const storage = await import('./storage.js');
    await storage.initStorage();
    log('storage OK');

    // data.json
    const res = await fetch('./data.json');
    const data = await res.json();
    log(`data.json: locations=${data.locations.length} categories=${data.categories.length}`);

    // カスタムアイテム保存・取得
    storage.setState('customItems', [{ id: 'test_1', name: 'テスト耳栓', categoryId: 'others', categoryName: 'その他', applicable_locations: ['shortstay'], quantity: 2, isCustom: true }]);
    const saved = storage.getState('customItems', []);
    log(`customItem saved: ${saved.length === 1 && saved[0].name === 'テスト耳栓' ? 'OK' : 'FAIL'}`);

    // 共有URLエンコード・デコード
    const shareData = { customItems: saved, containerNames: { box1: '赤いボストン' } };
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(shareData))));
    const decoded = JSON.parse(decodeURIComponent(escape(atob(encoded))));
    log(`share encode/decode: ${decoded.customItems[0].name === 'テスト耳栓' && decoded.containerNames.box1 === '赤いボストン' ? 'OK' : 'FAIL'}`);

    // クリーンアップ
    storage.removeState('customItems');
    log('DONE');
} catch (e) {
    log('ERR: ' + (e && e.stack || e));
}
</script>
</body>
</html>
