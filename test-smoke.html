<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>smoke</title></head>
<body><pre id="log"></pre>
<script type="module">
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
window.addEventListener('error', (e) => log('WINDOW_ERR: ' + e.message));
try {
    log('STEP1 module import');
    const mod = await import('./storage.js');
    log('STEP2 initStorage');
    await mod.initStorage();
    log('STEP3 fetch data.json');
    const res = await fetch('./data.json');
    log('STEP4 status=' + res.status);
    const data = await res.json();
    log('STEP5 locations=' + data.locations.length + ' categories=' + data.categories.length);
    mod.setState('smoke_test', { ok: true });
    log('STEP6 setState OK');
    log('DONE');
} catch (e) {
    log('ERR: ' + (e && e.stack || e));
}
</script>
</body>
</html>
