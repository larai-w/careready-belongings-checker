<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareReady // 持ち物チェッカー</title>
    <meta name="description" content="介護・入院・ショートステイの持ち物準備チェッカー">
    <meta name="theme-color" content="#121824">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121824; color: #e2e8f0; }
        .line-through-text { text-decoration: line-through; color: #4b5563; }
    </style>
</head>
<body class="p-4 md:p-8 font-sans">

    <div class="max-w-xl mx-auto">
        <div class="text-center my-6">
            <h1 class="text-3xl font-bold text-cyan-400 tracking-wider">CareReady</h1>
            <p class="text-sm text-gray-400 mt-1">// 持ち物チェッカー</p>
        </div>

        <div id="data-banner" class="hidden"></div>

        <div class="flex justify-center bg-gray-800 rounded-xl p-1 mb-4 max-w-xs mx-auto border border-gray-700">
            <button id="mode-category" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition-all bg-cyan-500 text-slate-900 shadow">
                📋 場所別リスト
            </button>
            <button id="mode-container" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition-all text-gray-400 hover:text-gray-200">
                📦 コンテナ別ソート
            </button>
        </div>

        <div id="location-tabs" class="flex flex-wrap gap-2 justify-center mb-6">
            <p class="text-gray-500 text-sm">データを読み込み中...</p>
        </div>

        <div class="flex items-center justify-between mb-4">
            <div class="text-xs text-gray-400">準備の進捗 (<span id="progress-text">0/0</span>)</div>
            <button id="reset-checks" class="text-xs text-red-400 hover:text-red-300 transition-colors bg-red-500/10 px-2 py-1 rounded border border-red-500/20">
                チェックをリセット
            </button>
        </div>
        <div class="bg-gray-800 rounded-full h-2.5 mb-6 overflow-hidden">
            <div id="progress-bar" class="bg-cyan-500 h-2.5 w-0 transition-all duration-300"></div>
        </div>

        <div id="checklist-container" class="space-y-6"></div>

        <div class="text-center mt-8 mb-4">
            <button id="reset-all" class="text-[11px] text-gray-600 hover:text-red-400 underline transition-colors">
                すべてのデータを削除(不要設定・箱の割り当て含む)
            </button>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
