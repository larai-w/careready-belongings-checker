<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareReady // 持ち物チェッカー</title>
    <meta name="description" content="介護・入院・ショートステイの持ち物準備チェッカー">
    <meta name="theme-color" content="#121824">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121824; color: #e2e8f0; }
        .line-through-text { text-decoration: line-through; color: #4b5563; }

        /* ===== 印刷スタイル ===== */
        @media print {
            /* 画面UIを全部隠す */
            body > div,
            #toast {
                display: none !important;
            }
            /* 印刷専用コンテナだけ表示 */
            #print-area {
                display: block !important;
            }
            body {
                background: #fff !important;
                color: #111 !important;
                font-family: sans-serif;
                margin: 0;
                padding: 16px;
            }
            #print-area {
                max-width: 100%;
            }
            #print-area h1 {
                font-size: 16pt;
                font-weight: bold;
                margin-bottom: 4px;
                border-bottom: 2px solid #333;
                padding-bottom: 4px;
            }
            #print-area .print-date {
                font-size: 9pt;
                color: #555;
                margin-bottom: 16px;
            }
            #print-area .print-category-title {
                font-size: 12pt;
                font-weight: bold;
                margin-top: 16px;
                margin-bottom: 6px;
                border-bottom: 1px solid #aaa;
                padding-bottom: 2px;
            }
            #print-area .print-item {
                display: flex;
                align-items: baseline;
                gap: 8px;
                padding: 4px 0;
                font-size: 10pt;
                break-inside: avoid;
            }
            #print-area .print-checkbox {
                flex-shrink: 0;
                font-size: 13pt;
            }
            #print-area .print-item-name {
                flex: 1;
            }
            #print-area .print-qty {
                font-size: 9pt;
                color: #666;
                white-space: nowrap;
            }
            #print-area .print-box {
                font-size: 9pt;
                color: #444;
                white-space: nowrap;
            }
        }
        /* 画面では印刷エリアを隠す */
        #print-area {
            display: none;
        }
    </style>
</head>
<body class="p-4 md:p-8 font-sans">

    <div class="max-w-xl mx-auto">
        <!-- ヘッダー -->
        <div class="flex items-center justify-between my-6">
            <div class="text-center flex-1">
                <h1 class="text-3xl font-bold text-cyan-400 tracking-wider">CareReady</h1>
                <p class="text-sm text-gray-400 mt-1">// 持ち物チェッカー</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button id="print-btn" class="flex items-center gap-1.5 text-xs bg-gray-800 border border-gray-700 text-gray-300 hover:text-cyan-400 hover:border-cyan-500/60 rounded-lg px-3 py-2 transition-colors">
                    🖨️ 印刷
                </button>
                <button id="share-btn" class="flex items-center gap-1.5 text-xs bg-gray-800 border border-gray-700 text-gray-300 hover:text-cyan-400 hover:border-cyan-500/60 rounded-lg px-3 py-2 transition-colors">
                    🔗 共有
                </button>
            </div>
        </div>

        <!-- テンプレ取り込みバナー -->
        <div id="import-banner" class="hidden bg-cyan-500/10 border border-cyan-500/30 rounded-xl px-4 py-3 mb-4 items-start justify-between gap-3">
            <div>
                <p class="text-sm font-bold text-cyan-300">リストを受け取りました</p>
                <p class="text-xs text-gray-400 mt-0.5">カスタムアイテムを取り込みますか？</p>
            </div>
            <div class="flex gap-2 shrink-0 mt-2">
                <button id="import-cancel" class="text-xs text-gray-500 hover:text-gray-300 px-3 py-1 rounded border border-gray-700 transition-colors">いいえ</button>
                <button id="import-ok" class="text-xs bg-cyan-500 text-slate-900 font-bold px-3 py-1 rounded-lg">取り込む</button>
            </div>
        </div>

        <!-- API フォールバックバナー -->
        <div id="data-banner" class="hidden"></div>

        <!-- 表示モード切替 (準備モード) -->
        <div id="view-mode-toggle" class="flex justify-center bg-gray-800 rounded-xl p-1 mb-3 max-w-xs mx-auto border border-gray-700">
            <button id="mode-category" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition-all bg-cyan-500 text-slate-900 shadow">
                📋 場所別リスト
            </button>
            <button id="mode-container" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition-all text-gray-400 hover:text-gray-200">
                📦 コンテナ別ソート
            </button>
        </div>

        <!-- 帰宅チェックモード切替 -->
        <div class="flex justify-center mb-4">
            <button id="mode-return" class="text-xs bg-gray-800 border border-gray-700 text-gray-400 hover:text-green-400 hover:border-green-500/60 rounded-xl px-4 py-1.5 transition-colors font-bold">
                🏠 帰宅チェックモード
            </button>
        </div>

        <!-- 場所タブ -->
        <div id="location-tabs" class="flex flex-wrap gap-2 justify-center mb-6">
            <p class="text-gray-500 text-sm">データを読み込み中...</p>
        </div>

        <!-- 進捗バー (準備モード) -->
        <div id="progress-section" class="flex items-center justify-between mb-4">
            <div class="text-xs text-gray-400">準備の進捗 (<span id="progress-text">0/0</span>)</div>
            <button id="reset-checks" class="text-xs text-red-400 hover:text-red-300 transition-colors bg-red-500/10 px-2 py-1 rounded border border-red-500/20">
                チェックをリセット
            </button>
        </div>
        <div id="progress-bar-wrap" class="bg-gray-800 rounded-full h-2.5 mb-6 overflow-hidden">
            <div id="progress-bar" class="bg-cyan-500 h-2.5 w-0 transition-all duration-300"></div>
        </div>

        <!-- 帰宅チェック進捗バー -->
        <div id="return-progress-section" class="hidden">
            <div class="flex items-center justify-between mb-4">
                <div class="text-xs text-green-400">帰宅確認の進捗 (<span id="return-progress-text">0/0</span>)</div>
                <div class="flex gap-2">
                    <button id="copy-missing-btn" class="text-xs text-amber-400 hover:text-amber-300 transition-colors bg-amber-500/10 px-2 py-1 rounded border border-amber-500/20">
                        📋 未返却リストをコピー
                    </button>
                    <button id="reset-return-checks" class="text-xs text-red-400 hover:text-red-300 transition-colors bg-red-500/10 px-2 py-1 rounded border border-red-500/20">
                        帰宅チェックをリセット
                    </button>
                </div>
            </div>
            <div class="bg-gray-800 rounded-full h-2.5 mb-6 overflow-hidden">
                <div id="return-progress-bar" class="bg-green-500 h-2.5 w-0 transition-all duration-300"></div>
            </div>
        </div>

        <!-- チェックリスト本体 -->
        <div id="checklist-container" class="space-y-6"></div>

        <!-- 全削除 -->
        <div class="text-center mt-8 mb-4">
            <button id="reset-all" class="text-[11px] text-gray-600 hover:text-red-400 underline transition-colors">
                すべてのデータを削除(不要設定・箱・カスタムアイテム含む)
            </button>
        </div>
    </div>

    <!-- アイテム追加モーダル -->
    <div id="add-modal" class="fixed inset-0 bg-black/70 z-50 hidden items-end sm:items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl p-6 w-full max-w-sm space-y-4" id="add-modal-inner">
            <h3 class="text-lg font-bold text-cyan-300">アイテムを追加</h3>

            <div>
                <label class="text-xs text-gray-400 block mb-1">アイテム名 <span class="text-red-400">*</span></label>
                <input id="modal-item-name" type="text" placeholder="例: 耳栓、替えの眼鏡ケース…" maxlength="50"
                    class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-cyan-500 placeholder-gray-600">
            </div>

            <div>
                <label class="text-xs text-gray-400 block mb-1">カテゴリー</label>
                <select id="modal-category"
                    class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-cyan-500">
                </select>
            </div>

            <div>
                <label class="text-xs text-gray-400 block mb-1">必要な行き先 (複数選択可)</label>
                <div id="modal-locations" class="flex flex-wrap gap-2 mt-1"></div>
            </div>

            <div>
                <label class="text-xs text-gray-400 block mb-1">必要な数量</label>
                <div class="flex items-center gap-3">
                    <button id="modal-qty-minus" class="w-8 h-8 rounded-full bg-gray-800 border border-gray-700 text-gray-300 hover:bg-gray-700 font-bold text-xl leading-none flex items-center justify-center">−</button>
                    <span id="modal-qty-display" class="text-lg font-bold text-gray-200 w-8 text-center">1</span>
                    <button id="modal-qty-plus" class="w-8 h-8 rounded-full bg-gray-800 border border-gray-700 text-gray-300 hover:bg-gray-700 font-bold text-xl leading-none flex items-center justify-center">+</button>
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button id="modal-cancel" class="flex-1 py-2.5 rounded-xl text-sm text-gray-400 bg-gray-800 hover:bg-gray-700 transition-colors">
                    キャンセル
                </button>
                <button id="modal-save" class="flex-1 py-2.5 rounded-xl text-sm font-bold text-slate-900 bg-cyan-500 hover:bg-cyan-400 transition-colors">
                    追加する
                </button>
            </div>
        </div>
    </div>

    <!-- 印刷専用エリア (通常非表示、@media print で表示) -->
    <div id="print-area"></div>

    <script type="module" src="./app.js"></script>
</body>
</html>
