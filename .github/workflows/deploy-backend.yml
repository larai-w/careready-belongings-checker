# バックエンド(CDK)デプロイ
#
# 方針: 「自動化 + 人間の確認」。
#   - main への push(backend/** 変更) → cdk synth + diff の「プレビュー」だけ実行(デプロイしない)
#   - 実デプロイは手動トリガー(Actions の "Run workflow")のみ = 人間の明示操作を必須にする
#     (CLAUDE.md「cdk deploy は人間の確認を得てから」を CI 上でも担保)
#
# 有効化に必要な設定:
#   Secrets:   AWS_BACKEND_ROLE_ARN (OIDC ロール。cdk bootstrap ロールの引き受けのみ可)
#              (このキーには CloudFormation/Lambda/APIGW/DynamoDB/IAM 等 CDK デプロイ権限が必要)
#   Variables: AWS_REGION (省略時: ap-northeast-1)
#   任意:      Environment "production-backend" に required reviewers を設定すると
#              手動トリガー後にさらに承認待ちの二重ゲートにできる
name: Deploy backend (CDK)

on:
  push:
    branches: [main]
    paths: ['backend/**']
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    # OIDC でロールを引き受けるために必要
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check AWS credentials
        id: creds
        run: |
          if [ -z "${{ secrets.AWS_BACKEND_ROLE_ARN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWSシークレット未設定のためスキップ (deploy-backend.yml のコメント参照)"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.creds.outputs.configured == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: '20'
      - name: Install CDK deps
        if: steps.creds.outputs.configured == 'true'
        run: pip install -r backend/infra/requirements.txt
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        if: steps.creds.outputs.configured == 'true'
        with:
          # 長期アクセスキーから OIDC へ移行（2026-08-17）。
          # このロールは AWS リソースへの直接権限を持たず、cdk bootstrap ロール
          # (deploy/file-publishing/image-publishing/lookup) の引き受けだけができる。
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      - name: CDK synth + diff (preview only)
        if: steps.creds.outputs.configured == 'true'
        working-directory: backend/infra
        run: |
          npx --yes aws-cdk@2 synth
          python3 validate_template.py cdk.out/CareReadyBackendStack.template.json
          npx --yes aws-cdk@2 diff || true

  deploy:
    # 実デプロイは手動トリガー時のみ(人間の明示操作)
    if: github.event_name == 'workflow_dispatch'
    needs: preview
    runs-on: ubuntu-latest
    # OIDC でロールを引き受けるために必要
    permissions:
      id-token: write
      contents: read
    environment: production-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check AWS credentials
        id: creds
        run: |
          if [ -z "${{ secrets.AWS_BACKEND_ROLE_ARN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::AWSシークレット未設定のためデプロイできません"
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install CDK deps
        run: pip install -r backend/infra/requirements.txt
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          # 長期アクセスキーから OIDC へ移行（2026-08-17）。
          # このロールは AWS リソースへの直接権限を持たず、cdk bootstrap ロール
          # (deploy/file-publishing/image-publishing/lookup) の引き受けだけができる。
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      - name: CDK deploy
        working-directory: backend/infra
        run: |
          npx --yes aws-cdk@2 synth
          python3 validate_template.py cdk.out/CareReadyBackendStack.template.json
          npx --yes aws-cdk@2 deploy --require-approval never
