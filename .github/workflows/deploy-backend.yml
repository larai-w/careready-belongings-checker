# Backend (CDK) deploy
#
# Stance: automation plus a human check.
#   - a push to main that changes backend/** runs only the preview (cdk synth +
#     diff). It does not deploy.
#   - a real deploy needs a manual trigger ("Run workflow" in Actions), so an
#     explicit human action is always required. This holds the CLAUDE.md rule
#     "cdk deploy only after a human has confirmed" on the CI side too.
#
# Configuration needed to enable it:
#   Secrets:   AWS_BACKEND_ROLE_ARN (OIDC role; can only assume the cdk bootstrap
#              roles, which in turn hold the CloudFormation, Lambda, API Gateway,
#              DynamoDB and IAM permissions a cdk deploy needs)
#   Variables: AWS_REGION (default: ap-northeast-1)
#   Optional:  setting required reviewers on the "production-backend" environment
#              adds a second gate: an approval wait after the manual trigger
name: Deploy backend (CDK)

on:
  push:
    branches: [main]
    paths: ['backend/**']
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    # Needed to assume the role via OIDC
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check AWS credentials
        id: creds
        run: |
          if [ -z "${{ secrets.AWS_BACKEND_ROLE_ARN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWSシークレット未設定のためスキップ (deploy-backend.yml のコメント参照)"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.creds.outputs.configured == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: '20'
      - name: Install CDK deps
        if: steps.creds.outputs.configured == 'true'
        run: pip install -r backend/infra/requirements.txt
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.creds.outputs.configured == 'true'
        with:
          # Moved from a long-lived access key to OIDC (2026-08-17). This role has
          # no direct permissions on AWS resources; all it can do is assume the cdk
          # bootstrap roles (deploy, file-publishing, image-publishing, lookup).
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      - name: CDK synth + diff (preview only)
        if: steps.creds.outputs.configured == 'true'
        working-directory: backend/infra
        run: |
          npx --yes aws-cdk@2 synth
          python3 validate_template.py cdk.out/CareReadyBackendStack.template.json
          npx --yes aws-cdk@2 diff || true

  deploy:
    # A real deploy happens only on a manual trigger: an explicit human action
    if: github.event_name == 'workflow_dispatch'
    needs: preview
    runs-on: ubuntu-latest
    # Needed to assume the role via OIDC
    permissions:
      id-token: write
      contents: read
    environment: production-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check AWS credentials
        id: creds
        run: |
          if [ -z "${{ secrets.AWS_BACKEND_ROLE_ARN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::AWSシークレット未設定のためデプロイできません"
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install CDK deps
        run: pip install -r backend/infra/requirements.txt
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # Moved from a long-lived access key to OIDC (2026-08-17). This role has
          # no direct permissions on AWS resources; all it can do is assume the cdk
          # bootstrap roles (deploy, file-publishing, image-publishing, lookup).
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      - name: CDK deploy
        working-directory: backend/infra
        run: |
          npx --yes aws-cdk@2 synth
          python3 validate_template.py cdk.out/CareReadyBackendStack.template.json
          npx --yes aws-cdk@2 deploy --require-approval never
