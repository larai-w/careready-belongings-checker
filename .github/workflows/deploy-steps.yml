# Reusable workflow for the S3 + CloudFront deploy.
# Called both from the deploy job in ci.yml and from deploy.yml (manual).
#
# Automatic CACHE_NAME bump: on deploy, CACHE_NAME in sw.js is overwritten with
# the git short hash. That removes stale caches caused by forgetting to bump it
# by hand. Local development keeps the static CACHE_NAME in sw.js as it is.
#
# Required secrets: AWS_DEPLOY_ROLE_ARN (ARN of the OIDC role)
# Required variables: S3_BUCKET, S3_PREFIX (default ready),
#                   AWS_REGION (default ap-northeast-1),
#                   CLOUDFRONT_DISTRIBUTION_ID (invalidation only when set)
name: Deploy Steps (reusable)

on:
  workflow_call:
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Needed to assume the role via OIDC. No long-lived keys.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check AWS credentials
        id: creds
        run: |
          if [ -z "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ] || [ -z "${{ vars.S3_BUCKET }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_DEPLOY_ROLE_ARN/S3_BUCKET が未設定のためデプロイをスキップしました"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.creds.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          # Moved from a long-lived access key to OIDC (2026-08-17). Permissions
          # are limited to veai-careready-frontend/ready/* plus CloudFront
          # invalidation for veai.jp. The bucket is shared with gutpacer and
          # others, which is why the prefix is kept narrow.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      # D4: automatic CACHE_NAME bump - inject the git short hash so a forgotten
      # manual bump cannot leave a stale cache behind
      - name: Inject CACHE_NAME from git hash
        if: steps.creds.outputs.configured == 'true'
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i "s/const CACHE_NAME = '[^']*'/const CACHE_NAME = 'careready-${SHORT_SHA}'/" sw.js
          echo "CACHE_NAME injected: careready-${SHORT_SHA}"
          grep "const CACHE_NAME" sw.js

      - name: Build dist
        if: steps.creds.outputs.configured == 'true'
        run: |
          mkdir -p dist
          cp index.html privacy.html app.js storage.js sw.js data.json manifest.webmanifest dist/
          cp -r icons dist/
          cp -r lib dist/
          [ -d admin ] && cp -r admin dist/ || true

      - name: Sync to S3
        if: steps.creds.outputs.configured == 'true'
        run: |
          PREFIX="${{ vars.S3_PREFIX || 'ready' }}"
          BUCKET="${{ vars.S3_BUCKET }}"
          # Long cache for image icons only. When their content changes, add a new
          # file or rely on CACHE_NAME.
          aws s3 sync dist/icons/ "s3://${BUCKET}/${PREFIX}/icons/" \
            --cache-control "public,max-age=86400"
          # The app itself (html, js, json, manifest, sw, admin) is served no-cache
          # so it is always current. With a max-age, an edge or a browser holds on
          # to an old app.js or data.json when the service worker updates.
          aws s3 sync dist/ "s3://${BUCKET}/${PREFIX}/" \
            --delete \
            --exclude "icons/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        if: steps.creds.outputs.configured == 'true' && vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          PREFIX="${{ vars.S3_PREFIX || 'ready' }}"
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/${PREFIX}/*"