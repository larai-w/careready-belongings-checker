# S3 + CloudFront デプロイの reusable workflow。
# ci.yml の deploy job と deploy.yml (手動) の両方から呼び出される。
#
# CACHE_NAME 自動バンプ: デプロイ時に sw.js の CACHE_NAME を git short hash で
# 上書きする。これにより手動バンプ漏れによるキャッシュ staleness を根絶する。
# ローカル開発時は sw.js の静的 CACHE_NAME をそのまま使う。
#
# 必要な Secrets: AWS_DEPLOY_ROLE_ARN (OIDC ロールの ARN)
# 必要な Variables: S3_BUCKET, S3_PREFIX(省略時 ready), AWS_REGION(省略時 ap-northeast-1),
#                   CLOUDFRONT_DISTRIBUTION_ID(設定時のみ無効化)
name: Deploy Steps (reusable)

on:
  workflow_call:
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # OIDC でロールを引き受けるために必要。長期キーは使わない。
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check AWS credentials
        id: creds
        run: |
          if [ -z "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ] || [ -z "${{ vars.S3_BUCKET }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_DEPLOY_ROLE_ARN/S3_BUCKET が未設定のためデプロイをスキップしました"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.creds.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          # 長期アクセスキーから OIDC へ移行（2026-08-17）。
          # 権限は veai-careready-frontend/ready/* と veai.jp の無効化に限定。
          # 同バケットを gutpacer 等と共有しているため、prefix を絞っている。
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      # D4: CACHE_NAME 自動バンプ — git short hash を注入して手動バンプ漏れを根絶
      - name: Inject CACHE_NAME from git hash
        if: steps.creds.outputs.configured == 'true'
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i "s/const CACHE_NAME = '[^']*'/const CACHE_NAME = 'careready-${SHORT_SHA}'/" sw.js
          echo "CACHE_NAME injected: careready-${SHORT_SHA}"
          grep "const CACHE_NAME" sw.js

      - name: Build dist
        if: steps.creds.outputs.configured == 'true'
        run: |
          mkdir -p dist
          cp index.html privacy.html app.js storage.js sw.js data.json manifest.webmanifest dist/
          cp -r icons dist/
          cp -r lib dist/
          [ -d admin ] && cp -r admin dist/ || true

      - name: Sync to S3
        if: steps.creds.outputs.configured == 'true'
        run: |
          PREFIX="${{ vars.S3_PREFIX || 'ready' }}"
          BUCKET="${{ vars.S3_BUCKET }}"
          # 画像アイコンだけ長期キャッシュ(内容更新時はファイル追加/CACHE_NAMEで対応)
          aws s3 sync dist/icons/ "s3://${BUCKET}/${PREFIX}/icons/" \
            --cache-control "public,max-age=86400"
          # アプリ本体(html/js/json/manifest/sw/admin)は no-cache で常に最新を配信
          # (max-age を付けると SW 更新時にエッジ/ブラウザが古い app.js/data.json を掴む)
          aws s3 sync dist/ "s3://${BUCKET}/${PREFIX}/" \
            --delete \
            --exclude "icons/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        if: steps.creds.outputs.configured == 'true' && vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          PREFIX="${{ vars.S3_PREFIX || 'ready' }}"
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/${PREFIX}/*"