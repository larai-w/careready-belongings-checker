name: Dependabot auto-merge
# Patch and minor dependency updates are merged automatically once CI is green
# (all the way to main). Major updates are reviewed by hand.
# Requires: repository setting "Allow auto-merge" (allow_auto_merge=true).
#       The real gate is branch protection on main. Without it, this is not
#       automation, it is a free pass.
#
# A merge to main DOES deploy the frontend.
#    ci.yml's deploy job runs on push:main (S3 sync + CloudFront invalidation via
#    deploy-steps.yml). Only the backend is dispatch-only: deploy-backend.yml runs
#    the preview (synth + diff) on push:main, and the real backend deploy and
#    deploy.yml are workflow_dispatch only. So an auto-merged dependency update
#    can reach production for the frontend - keep the gate below strict.
#    (Whether a GITHUB_TOKEN merge triggers that push run is not verified here.)
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge for patch/minor
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
