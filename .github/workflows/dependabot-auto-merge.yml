name: Dependabot auto-merge
# patch/minor の依存更新は CI 緑で自動マージ（main まで）。major は手動レビュー。
# 前提: リポジトリ設定 "Allow auto-merge" 有効（allow_auto_merge=true）。
#       main のブランチ保護が実際のゲート。**保護が無いとこれは自動化ではなく素通しになる。**
#
# ✅ このrepoでは本番デプロイは起きない。
#    `deploy-backend.yml` は push:main では preview（synth + diff）だけを走らせ、
#    実デプロイは `workflow_dispatch` に限っている。`deploy.yml` も dispatch のみ。
#    したがって carequest で起きた「main と本番がずれる」問題（GITHUB_TOKEN の push が
#    他のワークフローを起動しない仕様）は、ここでは当てはまらない。
#    ⚠️ 将来 push:main で実デプロイする経路を足したときは、この前提が崩れる。
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Enable auto-merge for patch/minor
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
