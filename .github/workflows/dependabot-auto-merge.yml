name: Dependabot auto-merge
# Patch and minor dependency updates are merged automatically once CI is green
# (all the way to main). Major updates are reviewed by hand.
# Requires: repository setting "Allow auto-merge" (allow_auto_merge=true).
#       The real gate is branch protection on main. Without it, this is not
#       automation, it is a free pass.
#
# No production deploy happens in this repo.
#    On push:main, deploy-backend.yml only runs the preview (synth + diff); the
#    real deploy is workflow_dispatch only, and deploy.yml is dispatch only too.
#    So the carequest problem - main drifting away from production because a
#    GITHUB_TOKEN push does not start other workflows - does not apply here.
#    That assumption breaks the day a real deploy is wired to push:main.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Enable auto-merge for patch/minor
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
