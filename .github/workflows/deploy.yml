# S3 + CloudFront へのデプロイ (veai.jp/ready/)
#
# 有効化するにはリポジトリに以下を設定する:
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   Variables: S3_BUCKET (例: veai-jp-frontend)
#              S3_PREFIX (省略時: ready)
#              AWS_REGION (省略時: ap-northeast-1)
#              CLOUDFRONT_DISTRIBUTION_ID (設定時のみキャッシュ無効化を実行)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check AWS credentials
        id: creds
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ vars.S3_BUCKET }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWSシークレット/S3_BUCKET が未設定のためデプロイをスキップしました (deploy.yml のコメント参照)"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.creds.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Build dist
        if: steps.creds.outputs.configured == 'true'
        run: |
          mkdir -p dist
          cp index.html privacy.html app.js storage.js sw.js data.json manifest.webmanifest dist/
          cp -r icons dist/
          [ -d admin ] && cp -r admin dist/ || true

      - name: Sync to S3
        if: steps.creds.outputs.configured == 'true'
        run: |
          PREFIX="${{ vars.S3_PREFIX || 'ready' }}"
          BUCKET="${{ vars.S3_BUCKET }}"
          # 画像アイコンだけ長期キャッシュ(内容更新時はファイル追加/CACHE_NAMEで対応)
          aws s3 sync dist/icons/ "s3://${BUCKET}/${PREFIX}/icons/" \
            --cache-control "public,max-age=86400"
          # アプリ本体(html/js/json/manifest/sw/admin)は no-cache で常に最新を配信
          # (max-age を付けると SW 更新時にエッジ/ブラウザが古い app.js/data.json を掴む)
          aws s3 sync dist/ "s3://${BUCKET}/${PREFIX}/" \
            --delete \
            --exclude "icons/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        if: steps.creds.outputs.configured == 'true' && vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          PREFIX="${{ vars.S3_PREFIX || 'ready' }}"
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/${PREFIX}/*"
