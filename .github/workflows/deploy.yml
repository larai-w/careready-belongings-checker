# Manual deploy to S3 + CloudFront (veai.jp/ready/)
#
# The normal push-to-main deploy is the `deploy` job in ci.yml (needs: check).
# This workflow is workflow_dispatch only: for an emergency or an exception where
# something goes to production by hand without CI.
# The deploy steps live in deploy-steps.yml (reusable), including the automatic
# CACHE_NAME bump.
#
# To enable it, configure the repository with:
#   Secrets:   AWS_DEPLOY_ROLE_ARN (ARN of the OIDC role)
#   Variables: S3_BUCKET (e.g. veai-jp-frontend)
#              S3_PREFIX (default: ready)
#              AWS_REGION (default: ap-northeast-1)
#              CLOUDFRONT_DISTRIBUTION_ID (invalidation runs only when set)
name: Deploy (manual)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-steps.yml
    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}