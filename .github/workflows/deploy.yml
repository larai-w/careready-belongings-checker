# S3 + CloudFront への手動デプロイ (veai.jp/ready/)
#
# 通常の main push デプロイは ci.yml の `deploy` job(needs: check)が担う。
# このワークフローは workflow_dispatch 専用 — CI を通さず手動で本番へ出す緊急/例外用。
# デプロイ手順本体は deploy-steps.yml (reusable) に集約。CACHE_NAME 自動バンプ付き。
#
# 有効化するにはリポジトリに以下を設定する:
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   Variables: S3_BUCKET (例: veai-jp-frontend)
#              S3_PREFIX (省略時: ready)
#              AWS_REGION (省略時: ap-northeast-1)
#              CLOUDFRONT_DISTRIBUTION_ID (設定時のみキャッシュ無効化を実行)
name: Deploy (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-steps.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}