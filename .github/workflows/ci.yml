name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enforce public repository boundary
        run: python3 scripts/check_public_repo.py --tracked

      - name: Syntax check (JS)
        run: |
          node --check app.js
          node --check storage.js
          node --check sw.js
          node --check admin/admin.js

      - name: Validate JSON
        run: |
          python3 -c "import json; json.load(open('data.json'))"
          python3 -c "import json; json.load(open('manifest.webmanifest'))"

      - name: Validate product content
        run: python3 scripts/validate_content.py

      - name: Validate product contracts
        run: python3 scripts/validate_product_contracts.py

      - name: Validate workflow security contracts
        run: python3 scripts/validate_workflow_security.py

      - name: Validate accessibility contracts
        run: python3 scripts/validate_accessibility_contracts.py

      - name: Validate frontend source policies
        env:
          CACHE_COMPARE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/validate_source_policy.py --base "$CACHE_COMPARE_BASE"

      - name: Backend tests
        run: |
          python3 -m pip install -r backend/requirements-test.txt
          python3 -m pytest backend/tests/ -q

      - name: Smoke test (headless Chrome)
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          sleep 2
          google-chrome --headless=new --disable-gpu --no-sandbox \
            --virtual-time-budget=25000 --dump-dom "http://127.0.0.1:8000/" > dom.html 2>/dev/null

          CHECKBOXES=$(grep -o 'type="checkbox"' dom.html | wc -l)
          echo "checkboxes rendered: $CHECKBOXES"
          if [ "$CHECKBOXES" -lt 20 ]; then
            echo "::error::チェックリストが描画されていません (checkboxes=$CHECKBOXES)"
            exit 1
          fi

          # 準備画面の見出しは「🧳 ◯◯ の準備・…」と動的表示になったため "の準備" で確認
          for LABEL in "おかえり" "どこへ" "箱に詰める" "の準備"; do
            if ! grep -q "$LABEL" dom.html; then
              echo "::error::UI要素が見つかりません: $LABEL"
              exit 1
            fi
          done
          echo "smoke test OK"

      - name: E2E test (headless Chrome)
        run: |
          # 実アプリを iframe で駆動する test-e2e.html を実行し、家族フロー(描画→
          # 進捗→帰宅モード→印刷/共有取込/施設コード/OCR/条件トグル/表示モード)を検証。
          # 注: headless --dump-dom + --virtual-time-budget は非同期多フェーズに対して
          # 仮想時間の消費量が非決定的で、稀に完走前に dump され途中打ち切りになる。
          # ローカルは決定的なので、CIではリトライで緩和する(全25チェック ALL_PASS を
          # 1度でも得れば合格。真の回帰なら毎回同じチェックが落ちて全リトライ失敗する)。
          python3 -m http.server 8001 --bind 127.0.0.1 &
          SRV=$!
          sleep 2
          ok=0
          for attempt in 1 2 3 4; do
            google-chrome --headless=new --disable-gpu --no-sandbox \
              --virtual-time-budget=600000 --dump-dom "http://127.0.0.1:8001/test-e2e.html" > e2e-dom.html 2>/dev/null
            if grep -qF "E2E_RESULT: ALL_PASS" e2e-dom.html; then
              echo "E2E OK (attempt $attempt)"; ok=1; break
            fi
            echo "E2E attempt $attempt incomplete/failed, retrying..."
          done
          kill "$SRV" 2>/dev/null || true

          if [ "$ok" -ne 1 ]; then
            echo "::error::E2E フローが4回とも ALL_PASS になりませんでした"
            grep -oE '(PASS|FAIL|WINDOW_ERR|ERR): [^<]*' e2e-dom.html | head -40 || true
            exit 1
          fi
