name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Enforce public repository boundary
        run: python3 scripts/check_public_repo.py --tracked

      # It only ran in pre-commit, so a clone without the hook installed, or a
      # change made through the web UI, went straight through (noticed
      # 2026-09-03). Run it over every tracked text file. The checker itself is
      # excluded via .langcheckignore, because it holds the characters it looks
      # for in its own regexes.
      - name: Check language contamination
        run: |
          git ls-files '*.md' '*.mjs' '*.js' '*.ts' '*.html' '*.py' \
            | xargs python3 scripts/check_language_contamination.py

      - name: Syntax check (JS)
        run: |
          node --check app.js
          node --check storage.js
          node --check sw.js
          node --check admin/admin.js
          node --check lib/ocr-match.js
          node --check lib/share.js
          node --check lib/checklist.js

      - name: Unit tests (frontend, node:test)
        run: node --test tests/*.test.js

      - name: Validate JSON
        run: |
          python3 -c "import json; json.load(open('data.json'))"
          python3 -c "import json; json.load(open('manifest.webmanifest'))"
          python3 scripts/validate_data_contract.py

      - name: Validate local documentation links
        run: python3 scripts/check_local_links.py

      - name: Validate product content
        run: python3 scripts/validate_content.py

      - name: Validate product contracts
        run: python3 scripts/validate_product_contracts.py

      - name: Validate workflow security contracts
        run: python3 scripts/validate_workflow_security.py

      - name: Audit workflow Action refs
        run: python3 scripts/audit_action_refs.py

      - name: Validate accessibility contracts
        run: python3 scripts/validate_accessibility_contracts.py

      - name: Validate frontend source policies
        env:
          CACHE_COMPARE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/validate_source_policy.py --base "$CACHE_COMPARE_BASE"

      - name: Backend tests
        run: |
          # Install from the lock file (every dependency pinned) for reproducibility
          python3 -m pip install -r backend/requirements-test.lock.txt
          python3 -m pytest backend/tests/ -q

      - name: Smoke test (headless Chrome)
        run: |
          # Retried for the same reason as the E2E job. With headless --dump-dom,
          # how much --virtual-time-budget gets consumed is non-deterministic, so
          # the dump occasionally happens before rendering finishes and comes out
          # truncated. main actually failed this way on 2026-08-18: 8ab3d23 passed
          # with identical content while merge commit 658a661 failed with
          # checkboxes=2. A real regression fails the same check every time, so it
          # still shows up as every retry failing.
          python3 -m http.server 8000 --bind 127.0.0.1 &
          SRV=$!
          sleep 2
          ok=0
          for attempt in 1 2 3 4; do
            google-chrome --headless=new --disable-gpu --no-sandbox \
              --virtual-time-budget=25000 --dump-dom "http://127.0.0.1:8000/" > dom.html 2>/dev/null

            CHECKBOXES=$(grep -o 'type="checkbox"' dom.html | wc -l)
            echo "attempt $attempt: checkboxes rendered: $CHECKBOXES"
            if [ "$CHECKBOXES" -lt 20 ]; then
              echo "attempt $attempt incomplete (checkboxes=$CHECKBOXES), retrying..."
              continue
            fi

            # The preparation screen heading became dynamic ("🧳 <name> の準備・…"),
            # so match on "の準備" instead of the whole string
            missing=""
            for LABEL in "おかえり" "どこへ" "箱に詰める" "の準備"; do
              grep -q "$LABEL" dom.html || missing="$missing $LABEL"
            done
            if [ -n "$missing" ]; then
              echo "attempt $attempt: UI要素が見つかりません:$missing"
              continue
            fi
            ok=1; echo "smoke test OK (attempt $attempt)"; break
          done
          kill "$SRV" 2>/dev/null || true

          if [ "$ok" -ne 1 ]; then
            echo "::error::スモークテストが4回とも通りませんでした(最後: checkboxes=$CHECKBOXES 欠落:$missing)"
            exit 1
          fi

      - name: E2E test (headless Chrome)
        run: |
          # Runs test-e2e.html, which drives the real app in an iframe, and checks
          # the family flow: render, progress, going-home mode, print, shared
          # import, facility code, OCR, condition toggles, display modes.
          # With headless --dump-dom plus --virtual-time-budget, how much virtual
          # time a multi-phase async flow consumes is non-deterministic, so the
          # dump occasionally happens before the run finishes and comes out
          # truncated. Locally it is deterministic; in CI it is softened with
          # retries. Getting ALL_PASS on all 25 checks once is a pass. A real
          # regression fails the same check every time, so every retry fails.
          python3 -m http.server 8001 --bind 127.0.0.1 &
          SRV=$!
          sleep 2
          ok=0
          for attempt in 1 2 3 4; do
            google-chrome --headless=new --disable-gpu --no-sandbox \
              --virtual-time-budget=600000 --dump-dom "http://127.0.0.1:8001/test-e2e.html" > e2e-dom.html 2>/dev/null
            if grep -qF "E2E_RESULT: ALL_PASS" e2e-dom.html; then
              echo "E2E OK (attempt $attempt)"; ok=1; break
            fi
            echo "E2E attempt $attempt incomplete/failed, retrying..."
          done
          kill "$SRV" 2>/dev/null || true

          if [ "$ok" -ne 1 ]; then
            echo "::error::E2E フローが4回とも ALL_PASS になりませんでした"
            grep -oE '(PASS|FAIL|WINDOW_ERR|ERR): [^<]*' e2e-dom.html | head -40 || true
            exit 1
          fi

  # Production deploy (veai.jp/ready/). Runs only on a push to main whose check
  # job is green: the gate that keeps a broken change from going straight to
  # production. For a manual deploy use deploy.yml (workflow_dispatch).
  # The deploy steps themselves live in deploy-steps.yml (reusable), including
  # the automatic CACHE_NAME bump.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-steps.yml
    permissions:
      id-token: write
      contents: read
    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
