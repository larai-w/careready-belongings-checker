name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Enforce public repository boundary
        run: python3 scripts/check_public_repo.py --tracked

      - name: Syntax check (JS)
        run: |
          node --check app.js
          node --check storage.js
          node --check sw.js
          node --check admin/admin.js

      - name: Validate JSON
        run: |
          python3 -c "import json; json.load(open('data.json'))"
          python3 -c "import json; json.load(open('manifest.webmanifest'))"
          python3 scripts/validate_data_contract.py

      - name: Validate local documentation links
        run: python3 scripts/check_local_links.py

      - name: Validate product content
        run: python3 scripts/validate_content.py

      - name: Validate product contracts
        run: python3 scripts/validate_product_contracts.py

      - name: Validate workflow security contracts
        run: python3 scripts/validate_workflow_security.py

      - name: Audit workflow Action refs
        run: python3 scripts/audit_action_refs.py

      - name: Validate accessibility contracts
        run: python3 scripts/validate_accessibility_contracts.py

      - name: Validate frontend source policies
        env:
          CACHE_COMPARE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/validate_source_policy.py --base "$CACHE_COMPARE_BASE"

      - name: Backend tests
        run: |
          python3 -m pip install -r backend/requirements-test.txt
          python3 -m pytest backend/tests/ -q

      - name: Smoke test (headless Chrome)
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          sleep 2
          google-chrome --headless=new --disable-gpu --no-sandbox \
            --virtual-time-budget=25000 --dump-dom "http://127.0.0.1:8000/" > dom.html 2>/dev/null

          CHECKBOXES=$(grep -o 'type="checkbox"' dom.html | wc -l)
          echo "checkboxes rendered: $CHECKBOXES"
          if [ "$CHECKBOXES" -lt 20 ]; then
            echo "::error::チェックリストが描画されていません (checkboxes=$CHECKBOXES)"
            exit 1
          fi

          # 準備画面の見出しは「🧳 ◯◯ の準備・…」と動的表示になったため "の準備" で確認
          for LABEL in "おかえり" "どこへ" "箱に詰める" "の準備"; do
            if ! grep -q "$LABEL" dom.html; then
              echo "::error::UI要素が見つかりません: $LABEL"
              exit 1
            fi
          done
          echo "smoke test OK"

      - name: E2E test (headless Chrome)
        run: |
          # 実アプリを iframe で駆動する test-e2e.html を実行し、家族フロー(描画→
          # 進捗→帰宅モード→印刷/共有取込/施設コード/OCR/条件トグル/表示モード)を検証。
          # 注: headless --dump-dom + --virtual-time-budget は非同期多フェーズに対して
          # 仮想時間の消費量が非決定的で、稀に完走前に dump され途中打ち切りになる。
          # ローカルは決定的なので、CIではリトライで緩和する(全25チェック ALL_PASS を
          # 1度でも得れば合格。真の回帰なら毎回同じチェックが落ちて全リトライ失敗する)。
          python3 -m http.server 8001 --bind 127.0.0.1 &
          SRV=$!
          sleep 2
          ok=0
          for attempt in 1 2 3 4; do
            google-chrome --headless=new --disable-gpu --no-sandbox \
              --virtual-time-budget=600000 --dump-dom "http://127.0.0.1:8001/test-e2e.html" > e2e-dom.html 2>/dev/null
            if grep -qF "E2E_RESULT: ALL_PASS" e2e-dom.html; then
              echo "E2E OK (attempt $attempt)"; ok=1; break
            fi
            echo "E2E attempt $attempt incomplete/failed, retrying..."
          done
          kill "$SRV" 2>/dev/null || true

          if [ "$ok" -ne 1 ]; then
            echo "::error::E2E フローが4回とも ALL_PASS になりませんでした"
            grep -oE '(PASS|FAIL|WINDOW_ERR|ERR): [^<]*' e2e-dom.html | head -40 || true
            exit 1
          fi

  # 本番(veai.jp/ready/)デプロイ。check(CI) が green の main push のときだけ実行する。
  # 壊れた変更が本番へ直行しないためのゲート。手動デプロイは deploy.yml(workflow_dispatch)。
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check AWS credentials
        id: creds
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ vars.S3_BUCKET }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWSシークレット/S3_BUCKET が未設定のためデプロイをスキップしました (deploy.yml のコメント参照)"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.creds.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Build dist
        if: steps.creds.outputs.configured == 'true'
        run: |
          mkdir -p dist
          cp index.html privacy.html app.js storage.js sw.js data.json manifest.webmanifest dist/
          cp -r icons dist/
          [ -d admin ] && cp -r admin dist/ || true

      - name: Sync to S3
        if: steps.creds.outputs.configured == 'true'
        run: |
          PREFIX="${{ vars.S3_PREFIX || 'ready' }}"
          BUCKET="${{ vars.S3_BUCKET }}"
          # 画像アイコンだけ長期キャッシュ(内容更新時はファイル追加/CACHE_NAMEで対応)
          aws s3 sync dist/icons/ "s3://${BUCKET}/${PREFIX}/icons/" \
            --cache-control "public,max-age=86400"
          # アプリ本体(html/js/json/manifest/sw/admin)は no-cache で常に最新を配信
          # (max-age を付けると SW 更新時にエッジ/ブラウザが古い app.js/data.json を掴む)
          aws s3 sync dist/ "s3://${BUCKET}/${PREFIX}/" \
            --delete \
            --exclude "icons/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        if: steps.creds.outputs.configured == 'true' && vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          PREFIX="${{ vars.S3_PREFIX || 'ready' }}"
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/${PREFIX}/*"
