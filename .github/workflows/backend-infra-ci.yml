name: Backend infrastructure CI

on:
  pull_request:
    paths:
      - 'backend/infra/**'
      - 'backend/push_sender/**'
      - '.github/workflows/backend-infra-ci.yml'
  push:
    branches: [main, development]
    paths:
      - 'backend/infra/**'
      - 'backend/push_sender/**'
      - '.github/workflows/backend-infra-ci.yml'

jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install CDK dependencies
        run: python3 -m pip install -r backend/infra/requirements.txt
      - name: Synthesize and validate security controls
        working-directory: backend/infra
        run: |
          npx --yes aws-cdk@2 synth --quiet
          python3 validate_template.py cdk.out/CareReadyBackendStack.template.json
      - name: Golden Path infrastructure report (non-blocking)
        id: golden-path
        continue-on-error: true
        working-directory: backend/infra
        run: |
          python3 -m unittest discover -s tests -p 'test_validate_golden_path.py'
          python3 validate_golden_path.py \
            --lambda-alias-selector '^careready-api$' \
            --require-api-throttling \
            cdk.out/CareReadyBackendStack.template.json
      - name: Publish Golden Path report status
        if: always()
        env:
          GOLDEN_PATH_OUTCOME: ${{ steps.golden-path.outcome }}
        run: |
          echo '### Golden Path infrastructure report' >> "$GITHUB_STEP_SUMMARY"
          if [ "$GOLDEN_PATH_OUTCOME" = 'success' ]; then
            echo '✅ Shared infrastructure controls passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '⚠️ Findings were reported above. Adoption is report-only and does not block CI.' >> "$GITHUB_STEP_SUMMARY"
          fi
