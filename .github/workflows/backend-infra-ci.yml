name: Backend infrastructure CI

on:
  pull_request:
    paths:
      - 'backend/infra/**'
      - 'backend/push_sender/**'
      - '.github/workflows/backend-infra-ci.yml'
  push:
    branches: [development]
    paths:
      - 'backend/infra/**'
      - 'backend/push_sender/**'
      - '.github/workflows/backend-infra-ci.yml'

jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install CDK dependencies
        run: python3 -m pip install -r backend/infra/requirements.txt
      - name: Synthesize and validate security controls
        working-directory: backend/infra
        run: |
          npx --yes aws-cdk@2 synth --quiet
          python3 validate_template.py cdk.out/CareReadyBackendStack.template.json
