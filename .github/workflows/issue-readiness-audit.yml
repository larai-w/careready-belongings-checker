name: Issue readiness audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * 1"

permissions:
  contents: read
  issues: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Issue readiness audit
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/audit_issue_readiness.py --repo "${{ github.repository }}" | tee issue-readiness-report.txt
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-readiness-report
          path: issue-readiness-report.txt
      - name: Fail when follow-up is needed
        if: steps.audit.outputs.status == '1'
        run: |
          echo "Open Issues need product-management follow-up; see the uploaded report."
          exit 1
