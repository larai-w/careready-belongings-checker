name: Security baseline

on:
  pull_request:
  push:
    branches: [main, development]
  schedule:
    # Monday 03:17 JST. The non-round minute avoids peak scheduler load.
    - cron: '17 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        # Run the pinned CLI directly so the scan does not depend on the
        # deprecated Node 20 runtime used by gitleaks-action v2.
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/repo"
          zricethezav/gitleaks:v8.30.1
          git
          --log-opts="--all"
          --redact
          --no-banner
          --config=/repo/.gitleaks.toml
          /repo

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit requirements
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: >-
            backend/infra/requirements.txt
            backend/push_sender/requirements.txt
            backend/requirements-test.txt
